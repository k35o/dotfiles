<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>k8o-design exemplar</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      body {
        --bg: #f3f4f6;
        --surface: #fff;
        --ink: #1c2126;
        --muted: #697280;
        --accent: #0d9488;
        --accent-soft: #e6f4f2;
        --accent-soft-ink: #0b7268;
        --radius-card: 20px;
        --shadow: 0 10px 30px rgb(25 35 45 / 0.06);

        font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.7;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 28px;
        max-width: 960px;
        margin: 0 auto;
        padding: 20px 24px;
      }
      .brand {
        font-weight: 700;
        font-size: 1.05em;
      }
      .nav {
        display: flex;
        gap: 22px;
        list-style: none;
      }
      .nav a {
        text-decoration: none;
        color: var(--muted);
        font-size: 0.92em;
        padding: 4px 2px;
      }
      .nav a.active {
        color: var(--ink);
        font-weight: 600;
      }
      .avatar {
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 0.78em;
        font-weight: 600;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 24px 64px;
      }

      .hero {
        margin-bottom: 28px;
      }
      .hero .date {
        color: var(--muted);
        font-size: 0.88em;
        margin-bottom: 6px;
      }
      .hero h1 {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.3;
        text-wrap: balance;
      }
      .hero .lead {
        color: var(--muted);
        margin-top: 8px;
        font-size: 0.95em;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 28px;
      }
      .stat,
      .panel {
        background: var(--surface);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow);
        padding: 26px;
      }
      .panel {
        margin-bottom: 28px;
      }
      .stat .label {
        color: var(--muted);
        font-size: 0.82em;
        margin-bottom: 4px;
      }
      .stat .value {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
      }
      .stat .value small {
        font-size: 0.5em;
        font-weight: 500;
        color: var(--muted);
        margin-left: 2px;
      }
      .stat .delta {
        font-size: 0.8em;
        color: var(--accent);
        margin-top: 4px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        margin-bottom: 18px;
      }
      .panel-head h2 {
        font-size: 17px;
        font-weight: 700;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      .tab {
        border: 0;
        background: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 0.88em;
        padding: 7px 16px;
        border-radius: 999px;
      }
      .tab.active {
        color: var(--ink);
        background: #eef1f4;
        font-weight: 600;
      }

      .habits {
        list-style: none;
      }
      .habit {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 12px;
        border-radius: 14px;
        transition: background 0.15s ease-out;
      }
      .habit + .habit {
        margin-top: 6px;
      }
      .habit:hover {
        background: #f6f8f9;
      }
      .habit .check {
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 999px;
        cursor: pointer;
        border: 2px solid #d4d9df;
        background: var(--surface);
        display: grid;
        place-items: center;
        transition:
          background 0.15s ease-out,
          border-color 0.15s ease-out;
      }
      .habit.done .check {
        background: var(--accent);
        border-color: var(--accent);
      }
      .habit .check svg {
        width: 58%;
        height: 58%;
        stroke: #fff;
        stroke-width: 3;
        fill: none;
        opacity: 0;
      }
      .habit.done .check svg {
        opacity: 1;
      }
      .habit .name {
        font-weight: 600;
        font-size: 0.98em;
      }
      .habit.done .name {
        color: var(--muted);
      }
      .habit .meta {
        color: var(--muted);
        font-size: 0.82em;
        margin-top: 1px;
      }
      .badge {
        margin-left: auto;
        flex: none;
        font-size: 0.76em;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-soft-ink);
      }

      /* フォーム行の整列: コントロールは同一高さ(--control-h)にして align-items: end で端を揃える。
   高さが揃っていればセンターも揃う。align-self や目分量のpaddingで合わせない */
      .add {
        --control-h: 48px;
        display: flex;
        gap: 16px;
        align-items: end;
      }
      .field {
        flex: 1;
      }
      .field.narrow {
        flex: 0 0 160px;
      }
      .field label {
        display: block;
        font-size: 0.8em;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 500;
      }
      .field input,
      .field select {
        width: 100%;
        height: var(--control-h);
        border: 1.5px solid #e2e6ea;
        background: var(--surface);
        border-radius: 14px;
        padding: 0 16px;
        outline: none;
        transition:
          border-color 0.15s ease-out,
          box-shadow 0.15s ease-out;
      }
      .field input:focus-visible,
      .field select:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
      }
      .add .submit {
        height: var(--control-h);
      }
      .btn {
        border: 0;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.92em;
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 11px 26px;
        white-space: nowrap;
        transition: filter 0.15s ease-out;
      }
      .btn:hover {
        filter: brightness(0.93);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">ツヅケル</div>
      <ul class="nav">
        <li><a class="active" href="#">今日</a></li>
        <li><a href="#">履歴</a></li>
        <li><a href="#">設定</a></li>
      </ul>
      <div class="avatar">K8</div>
    </header>

    <main>
      <section class="hero">
        <p class="date">2026年7月27日（月）</p>
        <h1>今日の記録</h1>
        <p class="lead">あと2つで今日の習慣がすべて完了します。</p>
      </section>

      <section class="stats">
        <div class="stat">
          <p class="label">連続記録</p>
          <p class="value">12<small>日</small></p>
          <p class="delta">自己ベスト更新中</p>
        </div>
        <div class="stat">
          <p class="label">今週の達成率</p>
          <p class="value">86<small>%</small></p>
          <p class="delta">先週 +9pt</p>
        </div>
        <div class="stat">
          <p class="label">累計チェック</p>
          <p class="value">148<small>回</small></p>
          <p class="delta">開始から74日</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>習慣リスト</h2>
          <div class="tabs">
            <button class="tab active">今日</button>
            <button class="tab">週間</button>
            <button class="tab">すべて</button>
          </div>
        </div>
        <ul class="habits">
          <li class="habit done">
            <button class="check" aria-label="ランニングを完了にする">
              <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
            </button>
            <div class="body">
              <p class="name">ランニング 30分</p>
              <p class="meta">運動・朝</p>
            </div>
            <span class="badge">12日連続</span>
          </li>
          <li class="habit done">
            <button class="check" aria-label="英語の勉強を完了にする">
              <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
            </button>
            <div class="body">
              <p class="name">英語の勉強</p>
              <p class="meta">学習・通勤中</p>
            </div>
            <span class="badge">31日連続</span>
          </li>
          <li class="habit">
            <button class="check" aria-label="読書を完了にする">
              <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
            </button>
            <div class="body">
              <p class="name">読書 20ページ</p>
              <p class="meta">学習・夜</p>
            </div>
            <span class="badge">5日連続</span>
          </li>
          <li class="habit">
            <button class="check" aria-label="筋トレを完了にする">
              <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
            </button>
            <div class="body">
              <p class="name">筋トレ</p>
              <p class="meta">運動・夜</p>
            </div>
            <span class="badge">今日から</span>
          </li>
        </ul>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>新しい習慣を追加</h2>
        </div>
        <div class="add">
          <div class="field">
            <label for="habit-name">習慣の名前</label>
            <input
              id="habit-name"
              type="text"
              placeholder="例：ストレッチ 10分"
            />
          </div>
          <div class="field narrow">
            <label for="habit-freq">頻度</label>
            <select id="habit-freq">
              <option>毎日</option>
              <option>平日のみ</option>
              <option>週3回</option>
            </select>
          </div>
          <button class="btn submit">追加する</button>
        </div>
      </section>
    </main>

    <script>
      document
        .querySelectorAll('.habits .check')
        .forEach((c) =>
          c.addEventListener('click', () =>
            c.closest('.habit').classList.toggle('done'),
          ),
        );
    </script>
  </body>
</html>
