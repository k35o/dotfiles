[providers]
keychain = { type = "keychain", service = "fnox" }
# tier1: キーチェーンの age-key。fnox にだけ「常に許可」を出す
age = { type = "age", recipients = [
  "age1u6jlgt5ghkc7vlk30jzgctlakywpca7sjyjshx42239pz235g53s3z5ygu",
  "age1eelp2tdzplj805m7cmhrtq77qdjp4a56j36g40cuses34dwqng5qyad8n3",
], identity = { provider = "keychain", value = "age-key" } }
# tier2: キーチェーンの age-key-bot。使うたびにキーチェーンの確認を通すため、daemon にも覚えさせない
age-bot = { type = "age", recipients = [
  "age1l26yrvtrts6l27g0ewc0ulk9qyk49x05nk72ds5e9uczvq8jeg3sqn0era",
], identity = { provider = "keychain", value = "age-key-bot" }, daemon_cache = false }

[mcp]
tools = ["exec"]
secrets = []

[profiles.bot.secrets]
K35O_BOT_CLIENT_ID= { provider = "age-bot", value = "" }
K35O_BOT_APP_ID= { provider = "age-bot", value = "" }
K35O_BOT_PRIVATE_KEY= { provider = "age-bot", value = "" }

[profiles.turso]

[profiles.turso.secrets]
TURSO_API_TOKEN= { provider = "age", value = "" }

[profiles.cloudflare]

[profiles.cloudflare.secrets]
CLOUDFLARE_API_TOKEN= { provider = "age", value = "" }

[profiles.vercel]

[profiles.vercel.secrets]
VERCEL_TOKEN= { provider = "age", value = "" }
