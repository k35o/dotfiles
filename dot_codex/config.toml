# OpenAI Codex CLI 設定
# 参考: https://github.com/openai/codex/blob/main/docs/config.md

# Claude の defaultMode="auto" に相当する組み合わせ。
# サンドボックス内の編集は自動で実行し、外側に出る操作だけ承認を求める。
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# 既定モデル: Sakana AI の fugu。GPT 解約のためこの PC では Sakana を標準で使う。
# dotfiles は共有。会社 PC は managed config(/etc/codex/managed_config.toml か MDM)が
# user config より上位で gateway を強制する想定（会社 PC で `codex doctor` で要確認）。
# もし会社で上書きされないなら profile での出し分け(config.toml.tmpl)に切り替える。
model = "fugu"
model_provider = "sakana"
model_reasoning_effort = "high"
# モデルカタログ（context_window=1M 等）。無いと codex が Sakana の /models を
# 取得しようとして失敗する（公式 fugu リポジトリ configs/files/fugu.json 由来）。
model_catalog_json = "~/.codex/fugu.json"

# Sakana の fugu は image_generation / apps ツール未対応のため無効化する。
# 有効だと API が `Invalid value: 'image_generation'` を返して起動できない。
[features]
image_generation = false
apps = false

# 通知を有効化（Claude の agentPushNotifEnabled 相当）。
[tui]
notifications = true
notification_condition = "unfocused"

# git push / npm install などのネットワーク必要操作は承認経由にする。
[sandbox_workspace_write]
network_access = false

[history]
persistence = "save-all"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '$HOME/.codex/security-hooks/run-hook.sh codex $HOME/.codex/security-hooks/prompt-submit.ts'
timeout = 10

[[hooks.PostToolUse]]
matcher = "^apply_patch$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = '$HOME/.codex/security-hooks/run-hook.sh codex $HOME/.codex/security-hooks/pattern-check.ts'
timeout = 10

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = '$HOME/.codex/security-hooks/run-hook.sh codex $HOME/.codex/security-hooks/stop-review.ts'
timeout = 120

[mcp_servers.fnox]
command = "fnox"
args = ["mcp"]

# Sakana AI プロバイダ（OpenAI 互換の /responses API）。
# API キー(SAKANA_API_KEY)は fnox 管理。シェルで fnox-activate（fnox activate zsh）して
# SAKANA_API_KEY を環境に載せた状態で codex を起動する。
# 参考: https://console.sakana.ai/get-started
[model_providers.sakana]
name = "Sakana API"
base_url = "https://api.sakana.ai/v1"
env_key = "SAKANA_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 7200000
stream_max_retries = 5
request_max_retries = 4

# Sakana fugu を明示選択: `codex -p fugu`。
[profiles.fugu]
model = "fugu"
model_provider = "sakana"
model_reasoning_effort = "high"

# 推論サマリ対応の上位モデル: `codex -p fugu-ultra`。
[profiles.fugu-ultra]
model = "fugu-ultra"
model_provider = "sakana"
model_reasoning_effort = "high"
