# OpenAI Codex CLI 設定
# 参考: https://github.com/openai/codex/blob/main/docs/config.md

# Claude の defaultMode="auto" に相当する組み合わせ。
# サンドボックス内の編集は自動で実行し、外側に出る操作だけ承認を求める。
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# 既定モデル: Sakana fugu（この PC の標準）。
model = "fugu"
model_provider = "sakana"
model_reasoning_effort = "high"
# モデルカタログ（無いと /models 取得に失敗）。
model_catalog_json = "~/.codex/fugu.json"

# fugu 非対応のツールを無効化（送ると API エラー）。
[features]
image_generation = false
apps = false

# 通知を有効化（Claude の agentPushNotifEnabled 相当）。
[tui]
notifications = true
notification_condition = "unfocused"

# git push / npm install などのネットワーク必要操作は承認経由にする。
[sandbox_workspace_write]
network_access = false

[history]
persistence = "save-all"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '$HOME/.codex/security-hooks/run-hook.sh codex $HOME/.codex/security-hooks/prompt-submit.ts'
timeout = 10

[[hooks.PostToolUse]]
matcher = "^apply_patch$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = '$HOME/.codex/security-hooks/run-hook.sh codex $HOME/.codex/security-hooks/pattern-check.ts'
timeout = 10

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = '$HOME/.codex/security-hooks/run-hook.sh codex $HOME/.codex/security-hooks/stop-review.ts'
timeout = 120

[mcp_servers.fnox]
command = "fnox"
args = ["mcp"]

# Sakana AI プロバイダ。キー(SAKANA_API_KEY)は fnox 管理。
[model_providers.sakana]
name = "Sakana API"
base_url = "https://api.sakana.ai/v1"
env_key = "SAKANA_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 7200000
stream_max_retries = 5
request_max_retries = 4

[profiles.fugu]
model = "fugu"
model_provider = "sakana"
model_reasoning_effort = "high"

# 上位モデル（推論サマリ対応）: codex -p fugu-ultra
[profiles.fugu-ultra]
model = "fugu-ultra"
model_provider = "sakana"
model_reasoning_effort = "high"
