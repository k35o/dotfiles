name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run lint and format check
        run: pnpm check

  security-hooks:
    name: security-hooks test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Run security-hooks tests
        working-directory: dot_agents/security-hooks
        run: bun test

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .

  chezmoi:
    name: chezmoi verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Run chezmoi apply --dry-run
        env:
          CHEZMOI_HOME: ${{ runner.temp }}/chezmoi-home
        run: |
          # mise 2026.7.13以降のshimは$HOME配下からツールを解決するため、
          # HOMEを差し替える前に実体のパスを解決しておく
          CHEZMOI_BIN="$(mise which chezmoi)"
          mkdir -p "$CHEZMOI_HOME/.config/chezmoi"
          cat > "$CHEZMOI_HOME/.config/chezmoi/chezmoi.toml" <<'EOF'
          [data]
          profile = "personal"
          EOF
          HOME="$CHEZMOI_HOME" "$CHEZMOI_BIN" apply \
            --dry-run \
            --verbose \
            --source "$GITHUB_WORKSPACE"
