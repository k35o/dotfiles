name: Install
description: Sets up mise and runs install

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v5.2.6 # zizmor: ignore[unpinned-uses] $/ で呼ぶワークフローの actions.lock がコミットを固定する
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm ci
